# Configuração Local do Extrato API
# Este arquivo configura a conexão com o Config Server

spring:
  application:
    name: extrato-api
  
  # Configuração do Spring Cloud Config Client
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  
  # Profile ativo (pode ser sobrescrito por variável de ambiente)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  cloud:
    config:
      # Nome da aplicação para buscar no Config Server
      name: ${spring.application.name}
      # Profile para buscar (dev, hml, prod)
      profile: ${SPRING_PROFILES_ACTIVE:dev}
      # Label/branch do repositório Git
      label: ${CONFIG_LABEL:main}
      # URI do Config Server
      uri: ${CONFIG_SERVER_URL:http://localhost:8888}
      # Fail fast se não conseguir conectar ao Config Server
      fail-fast: ${CONFIG_FAIL_FAST:false}
      # Retry configuration
      retry:
        max-attempts: ${CONFIG_RETRY_MAX_ATTEMPTS:6}
        initial-interval: ${CONFIG_RETRY_INITIAL_INTERVAL:1000}
        max-interval: ${CONFIG_RETRY_MAX_INTERVAL:2000}
        multiplier: ${CONFIG_RETRY_MULTIPLIER:1.1}

# Configuração do Actuator (para health check)
management:
  endpoints:
    web:
      exposure:
        include: health,info,env,configprops
  endpoint:
    health:
      show-details: always

# Configuração de logging
logging:
  level:
    "[org.springframework.cloud.config]": DEBUG
    "[br.com.financas.extrato_api]": INFO
